version: '3.8'
 
services:
 
  # ── Telegram Bot ──────────────────────────────────────────────────────
  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiqna-bot
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - QDRANT_URL=http://qdrant:6333
      - WEBHOOK_URL=${WEBHOOK_URL}
      - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - app-net
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
 
  # ── Qdrant Vector Database ────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aiqna-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
 
  # ── n8n Automation ────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: aiqna-n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${DOMAIN}/
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-net
 
  # ── PostgreSQL (used by n8n) ───────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: aiqna-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      retries: 5
 
  # ── Nginx Reverse Proxy ───────────────────────────────────────────────
  # Handles SSL termination for both the bot webhook and the n8n editor.
  nginx:
    image: nginx:alpine
    container_name: aiqna-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - bot
      - n8n
    networks:
      - app-net
 
volumes:
  qdrant_data:
  n8n_data:
  postgres_data:
 
networks:
  app-net:
    driver: bridge
