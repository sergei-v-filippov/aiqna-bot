events {
  worker_connections 1024;
}
 
http {
  # Redirect all plain HTTP traffic to HTTPS
  server {
    listen 80;
    server_name your-domain.com n8n.your-domain.com;
    return 301 https://$host$request_uri;
  }
 
  # Health check endpoint — HTTP only, used by GitHub Actions post-deploy check
  server {
    listen 80;
    server_name _;
    location /health {
      return 200 'ok';
      add_header Content-Type text/plain;
    }
  }
 
  # Bot webhook — receives updates from Telegram
  server {
    listen 443 ssl;
    server_name your-domain.com;
 
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
 
    # Forward Telegram webhook calls to the bot container
    location /webhook {
      proxy_pass       http://bot:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
 
    # Bot health check — used internally and by monitoring
    location /health {
      proxy_pass http://bot:3001;
    }
  }
 
  # n8n editor and webhook endpoints
  server {
    listen 443 ssl;
    server_name n8n.your-domain.com;
 
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
 
    location / {
      proxy_pass         http://n8n:5678;
      proxy_http_version 1.1;
      # WebSocket support — required for the n8n editor UI
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
